<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成功愛樂 繳費</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #222; --muted: #6b6b6b; --line: #e3e0d8;
    --accent: #7a2e2e; --accent-ink: #fff; --ok: #2e7d32; --warn: #b26a00; --bad: #b3261e; --info: #1f5f99;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; margin: 0 0 10px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  textarea { min-height: 64px; resize: vertical; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 12px 16px; cursor: pointer; }
  .primary { background: var(--accent); color: var(--accent-ink); width: 100%; margin-top: 16px; font-weight: 600; }
  .primary:disabled { opacity: .5; }
  .link { background: none; color: var(--info); padding: 4px 0; text-decoration: underline; }
  .copy { background: #efece5; color: var(--ink); padding: 4px 10px; font-size: 13px; margin-left: 8px; flex: none; }
  .suggest { list-style: none; margin: 4px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: #fff; max-height: 240px; overflow: auto; }
  .suggest li { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .suggest li:last-child { border-bottom: 0; }
  .suggest li:active, .suggest li:hover { background: #f3efe6; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 0; border-bottom: 1px solid var(--line); }
  td.amt { text-align: right; font-variant-numeric: tabular-nums; }
  tr.total td { border-bottom: 0; font-weight: 700; font-size: 18px; padding-top: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; gap: 8px; }
  .row .k { color: var(--muted); font-size: 14px; flex: none; }
  .row .v { font-weight: 600; word-break: break-all; text-align: right; flex: 1; }
  #qr { display: flex; justify-content: center; margin: 12px 0 4px; }
  #qr img, #qr canvas { width: 200px; height: 200px; }
  .hint { color: var(--muted); font-size: 13px; }
  .banner { border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-weight: 600; }
  .b-ok { background: #e6f4ea; color: var(--ok); }
  .b-info { background: #e8f0fa; color: var(--info); }
  .b-warn { background: #fdf0dc; color: var(--warn); }
  .b-bad { background: #fce8e6; color: var(--bad); }
  .note { white-space: pre-wrap; }
  .err { color: var(--bad); font-size: 14px; margin-top: 8px; }
  .hidden { display: none !important; }
  .preview { max-width: 100%; max-height: 200px; margin-top: 8px; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1>成功愛樂 繳費</h1>
  <div class="sub" id="subtitle"></div>

  <section id="pick" class="card">
    <h2>請輸入你的名字</h2>
    <input id="nameInput" autocomplete="off" placeholder="輸入名字…">
    <ul id="suggest" class="suggest hidden"></ul>
    <div id="pickErr" class="err"></div>
  </section>

  <section id="loading" class="card hidden">讀取中…</section>
  <section id="view" class="hidden"></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // Apps Script 部署網址（資料都在 Google 試算表，這個頁面只負責顯示）
  const API = 'https://script.google.com/macros/s/AKfycbzrbO0_QNbwQQ2Kw4tnlSw9qCwvHiGT02Pju9ZX32W3r4V8Ebu4Q8UZKo_9gj-aIRKVBw/exec';
  let BOOT = { names: [], section: '', keepMonths: 6 };
  const $ = (id) => document.getElementById(id);

  // 不帶 Google 登入資訊（credentials: omit），所以瀏覽器登入多個帳號也不影響；
  // 用 text/plain 送出，避免 CORS 預檢
  function api(action, payload) {
    return fetch(API, {
      method: 'POST',
      credentials: 'omit',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, payload)),
    })
      .then(r => { if (!r.ok) throw new Error('連線失敗（' + r.status + '），請稍後再試。'); return r.json(); })
      .then(j => { if (j.error) throw new Error(j.error); return j.data; });
  }
  const money = (n) => Number(n).toLocaleString('zh-TW');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let current = null;
  let shotData = null;

  // ===== 選名字 =====
  const input = $('nameInput');
  input.addEventListener('input', renderSuggest);
  input.addEventListener('focus', renderSuggest);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const v = input.value.trim();
      const hits = matches(v);
      if (BOOT.names.includes(v)) choose(v);
      else if (hits.length === 1) choose(hits[0]);
    }
  });

  function matches(q) {
    q = q.trim();
    if (!q) return BOOT.names.slice();
    return BOOT.names.filter(n => n.includes(q));
  }

  function renderSuggest() {
    const list = matches(input.value);
    const ul = $('suggest');
    $('pickErr').textContent = '';
    if (!input.value.trim() || !list.length) {
      ul.classList.add('hidden');
      if (input.value.trim() && !list.length) $('pickErr').textContent = '名單中找不到這個名字，請聯絡聲部長。';
      return;
    }
    ul.innerHTML = list.slice(0, 30).map(n => '<li data-name="' + esc(n) + '">' + esc(n) + '</li>').join('');
    ul.classList.remove('hidden');
  }

  $('suggest').addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (li) choose(li.dataset.name);
  });

  function choose(name) {
    $('suggest').classList.add('hidden');
    input.value = name;
    try { localStorage.setItem('member', name); } catch (e) {}
    load(name);
  }

  function load(name) {
    show('loading');
    api('info', { name: name })
      .then(render)
      .catch(err => { show('pick'); $('pickErr').textContent = err.message || String(err); });
  }

  function show(which) {
    ['pick', 'loading', 'view'].forEach(id => $(id).classList.toggle('hidden', id !== which));
  }

  function switchPerson() {
    try { localStorage.removeItem('member'); } catch (e) {}
    input.value = '';
    show('pick');
    input.focus();
  }

  // ===== 個人頁 =====
  function statusBanner(info) {
    const s = info.status;
    switch (s.code) {
      case 'done': return '<div class="banner b-ok">✅ 財務已核對入帳，完成！</div>';
      case 'cash': return '<div class="banner b-info">💵 聲部長已於 ' + esc(s.paidAt) + ' 收到現金 ' + money(s.amount) + ' 元，等待交給財務入帳</div>';
      case 'leader': return '<div class="banner b-info">👀 聲部長已確認資料，等待財務核對入帳</div>';
      case 'reported': return '<div class="banner b-info">📨 已收到你的繳款回報（' + esc(s.paidAt) + '，' + money(s.amount) + ' 元），等待確認</div>';
      case 'issue': return '<div class="banner b-bad">⚠ 請修正：' + esc(s.issue) + '</div>';
      default: return '';
    }
  }

  function render(info) {
    current = info;
    shotData = null;
    const v = $('view');
    if (!info.found) {
      show('pick');
      $('pickErr').textContent = '名單中找不到你的名字，請聯絡聲部長。';
      return;
    }

    let html = '<div class="row" style="margin-bottom:8px"><div><b>' + esc(info.name) + '</b> 你好</div>' +
      '<button class="link" onclick="switchPerson()">不是你？</button></div>';

    if (!info.open) {
      html += '<div class="card"><h2>目前沒有收款項目</h2>';
      html += '<div class="hint">上一期「' + esc(info.period) + '」的狀態：</div><div style="margin-top:10px">' +
        (statusBanner(info) || '<div class="banner b-warn">沒有你的繳款紀錄，如有疑問請聯絡聲部長。</div>') + '</div></div>';
      v.innerHTML = html;
      show('view');
      return;
    }

    html += statusBanner(info);

    // 應繳明細
    html += '<div class="card"><h2>' + esc(info.period) + '</h2>';
    if (info.deadline) {
      html += '<div class="hint" style="margin-bottom:8px">繳費截止日：' + esc(info.deadline) +
        (info.overdue && ['none', 'issue'].includes(info.status.code) ? '　<b style="color:var(--bad)">已超過截止日，請盡快繳納</b>' : '') + '</div>';
    }
    if (info.items.length) {
      html += '<table>' + info.items.map(i => '<tr><td>' + esc(i.item) + '</td><td class="amt">' + money(i.amount) + '</td></tr>').join('') +
        '<tr class="total"><td>合計</td><td class="amt">' + money(info.total) + ' 元</td></tr></table>';
    } else {
      html += '<div class="hint">這一期你沒有需要繳的費用。</div>';
    }
    if (info.note) html += '<p class="note hint">' + esc(info.note) + '</p>';
    html += '</div>';

    const code = info.status.code;
    const needsPay = info.total > 0 && ['none', 'issue', 'reported', 'leader'].includes(code);
    if (needsPay) {
      const reportOpen = code === 'none' || code === 'issue';
      html += payCard(info);
      if (!reportOpen) {
        html += '<div style="text-align:center;margin-bottom:14px"><button class="link" onclick="openReport()">資料填錯了？重新回報</button></div>';
      }
      html += reportCard(info, reportOpen);
    }

    v.innerHTML = html;
    show('view');
    if (needsPay) {
      setupForm();
      drawQr(info.twqr);
    }
  }

  function payCard(info) {
    const b = info.bank;
    return '<div class="card"><h2>轉帳資訊</h2>' +
      '<div class="row"><span class="k">銀行</span><span class="v">' + esc(b.name) + '（' + esc(b.code) + '）</span>' +
        '<button class="copy" onclick="copyText(\'' + esc(b.code) + '\', this)">複製</button></div>' +
      '<div class="row"><span class="k">帳號</span><span class="v">' + esc(b.account) + '</span>' +
        '<button class="copy" onclick="copyText(\'' + esc(b.account) + '\', this)">複製</button></div>' +
      (b.holder ? '<div class="row"><span class="k">戶名</span><span class="v">' + esc(b.holder) + '</span></div>' : '') +
      '<div class="row"><span class="k">金額</span><span class="v">' + money(info.total) + ' 元</span>' +
        '<button class="copy" onclick="copyText(\'' + info.total + '\', this)">複製</button></div>' +
      (info.twqr ? '<div id="qr"></div><div class="hint" style="text-align:center">用另一台裝置開啟此頁時，可以用銀行 APP 掃描 QR Code 轉帳</div>' : '') +
      '</div>';
  }

  function reportCard(info, open) {
    return '<div class="card' + (open ? '' : ' hidden') + '" id="reportCard"><h2>轉帳後，請回報繳款資料</h2>' +
      '<form id="reportForm">' +
      '<label for="paidAt">轉帳時間</label><input id="paidAt" type="datetime-local" required>' +
      '<label for="last5">你的匯款帳號後五碼</label><input id="last5" inputmode="numeric" maxlength="5" placeholder="例如 12345" required>' +
      '<div class="hint">請看存摺封面或銀行 APP 的帳戶總覽；轉帳成功畫面通常只顯示部分號碼。</div>' +
      '<label for="amount">轉帳金額</label><input id="amount" inputmode="numeric" value="' + info.total + '" required>' +
      '<label for="shot">轉帳截圖（選填）</label><input id="shot" type="file" accept="image/*">' +
      '<img id="preview" class="preview hidden" alt="">' +
      '<label for="note">備註（選填）</label><textarea id="note" maxlength="500"></textarea>' +
      '<button class="primary" id="submitBtn" type="submit">送出回報</button>' +
      '<div id="formErr" class="err"></div>' +
      '<p class="hint">截圖僅供聲部長與財務核對，收款結束 ' + BOOT.keepMonths + ' 個月後刪除。</p>' +
      '</form></div>';
  }

  function openReport() {
    $('reportCard').classList.remove('hidden');
    $('reportCard').scrollIntoView({ behavior: 'smooth' });
  }

  function drawQr(text) {
    if (!text || !$('qr') || typeof QRCode === 'undefined') return;
    new QRCode($('qr'), { text: text, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  }

  function copyText(text, btn) {
    const done = () => { const t = btn.textContent; btn.textContent = '已複製'; setTimeout(() => btn.textContent = t, 1500); };
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { prompt('請手動複製：', text); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  // ===== 回報表單 =====
  function nowLocal() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function setupForm() {
    $('paidAt').value = nowLocal();
    $('last5').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 5); });
    $('amount').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, ''); });
    $('shot').addEventListener('change', onPickShot);
    $('reportForm').addEventListener('submit', onSubmit);
  }

  function onPickShot(e) {
    shotData = null;
    const file = e.target.files[0];
    const img = $('preview');
    img.classList.add('hidden');
    if (!file) return;
    compress(file).then(data => {
      shotData = data;
      img.src = 'data:' + data.mimeType + ';base64,' + data.data;
      img.classList.remove('hidden');
    }).catch(() => { $('formErr').textContent = '這張圖片無法讀取，請換一張或改用截圖。'; e.target.value = ''; });
  }

  // 短邊最多 1080px（手機截圖原本的寬度，文字清楚）、長邊最多 2400px，轉成 JPEG；
  // 還是超過 500KB 就降低畫質，讓上傳快、雲端也不佔空間
  function compress(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const short = Math.min(img.width, img.height), long = Math.max(img.width, img.height);
          const scale = Math.min(1, 1080 / short, 2400 / long);
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; // 透明背景的 PNG 轉 JPEG 時才不會變黑
          ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          let data;
          for (const q of [0.8, 0.65, 0.5]) {
            data = c.toDataURL('image/jpeg', q).split(',')[1];
            if (data.length * 0.75 <= 500 * 1024) break;
          }
          resolve({ data: data, mimeType: 'image/jpeg' });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function onSubmit(e) {
    e.preventDefault();
    const err = $('formErr');
    err.textContent = '';
    const last5 = $('last5').value.trim();
    const amount = $('amount').value.trim();
    if (!/^\d{3,5}$/.test(last5)) { err.textContent = '匯款帳號後五碼請填 3～5 位數字。'; return; }
    if (last5.length < 5 && !confirm('建議填滿五碼，財務比較好核對。確定只填 ' + last5.length + ' 碼嗎？')) return;
    if (!/^\d+$/.test(amount) || Number(amount) <= 0) { err.textContent = '請填轉帳金額。'; return; }
    if (Number(amount) !== current.total &&
        !confirm('你填的金額 ' + money(amount) + ' 元和應繳合計 ' + money(current.total) + ' 元不同，確定送出嗎？')) return;

    const btn = $('submitBtn');
    btn.disabled = true;
    btn.textContent = '送出中…';
    api('submit', {
      name: current.name,
      paidAt: $('paidAt').value,
      last5: last5,
      amount: Number(amount),
      note: $('note').value,
      file: shotData,
    })
      .then(info => { render(info); window.scrollTo(0, 0); })
      .catch(ex => { btn.disabled = false; btn.textContent = '送出回報'; err.textContent = ex.message || String(ex); });
  }

  function applyBoot(boot) {
    BOOT = boot;
    $('subtitle').textContent = BOOT.section ? BOOT.section + '聲部' : '';
    input.disabled = false;
    input.placeholder = '輸入名字…';
  }

  // 上次的名單先拿來用，名字可以馬上輸入；記得名字的人，名單和個人資料一次請求拿回來
  (function init() {
    let saved = null, cachedBoot = null;
    try {
      saved = localStorage.getItem('member');
      cachedBoot = JSON.parse(localStorage.getItem('boot') || 'null');
    } catch (e) {}
    if (cachedBoot) applyBoot(cachedBoot);
    else { input.disabled = true; input.placeholder = '名單載入中…'; }
    if (saved) { input.value = saved; show('loading'); }

    api('boot', saved ? { name: saved } : {})
      .then(boot => {
        const info = boot.info;
        delete boot.info;
        applyBoot(boot);
        try { localStorage.setItem('boot', JSON.stringify(boot)); } catch (e) {}
        if (!saved) return;
        if (info && info.found) render(info);
        else { input.value = ''; show('pick'); }
      })
      .catch(err => {
        show('pick');
        if (!cachedBoot) input.placeholder = '';
        $('pickErr').textContent = '載入失敗：' + (err.message || err) + ' 請重新整理頁面。';
      });
  })();
</script>
</body>
</html>
